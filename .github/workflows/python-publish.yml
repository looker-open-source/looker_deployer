name: Python Publish to PYPI
on:
  release:
    types: published

  workflow_dispatch:
    inputs:
      ref:
        description: 'commit/tag/branch to release from'
        required: true

defaults:
  run:
    shell: bash

permissions:
  contents: read

jobs:
  publish:
    if: >
      (github.event.inputs) ||
      (startsWith(github.event.release.tag_name, 'looker-deployer') &&
      !github.event.release.draft &&
      !github.event.release.prerelease)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@0717577d45739eb3c851188b29f50ed6c0b2194e # v2
        with:
          ref: ${{ github.event.release.tag_name || github.event.inputs.ref }}
          persist-credentials: false

      - uses: actions/setup-python@e9aba2c848f5ebd159c070c61ea2c4e2b122355e # v2
        with:
          python-version: 3.10

      - name: Package release artifacts
        run: |
          pip install wheel
          python setup.py sdist bdist_wheel

      - uses: pypa/gh-action-pypi-publish@ed0c53931b1dc9bd32cbe73a98c7f6766f8a527e # v1.13.0
        with:
          user: __token__
          password: ${{ secrets.PYPI_API_TOKEN }} # zizmor: ignore[use-trusted-publishing] requires PyPI admin configuration
          packages_dir: dist/
